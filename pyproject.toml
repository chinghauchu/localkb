[project]
name = "localkb"
version = "0.1.0"
description = "Private, local-first knowledge base for any AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chinghauchu" }]
keywords = ["knowledge-base", "local-first", "mcp", "search", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastembed>=0.6",
  "markitdown[docx,pptx,xlsx]>=0.1.4",
  "mcp>=2.3",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Reserved. Ollama embeddings are rejected with an explicit error in v0.1.
ollama = []

[project.urls]
Homepage = "https://github.com/chinghauchu/localkb"
Repository = "https://github.com/chinghauchu/localkb"

[project.scripts]
localkb = "localkb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pytest>=8.2",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
